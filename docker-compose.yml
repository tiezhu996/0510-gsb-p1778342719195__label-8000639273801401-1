version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: card_db
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: card_management
      TZ: Asia/Shanghai
    ports:
      - "13198:3306"
    volumes:
      - db_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: card_backend
    ports:
      - "8198:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/card_management?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123456
    restart: always

  frontend:
    build: ./frontend
    container_name: card_frontend
    ports:
      - "3198:80"
    depends_on:
      - backend
    restart: always

volumes:
  db_data:
